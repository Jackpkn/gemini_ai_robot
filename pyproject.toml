[project]
name = "teleop-lab"
version = "0.1.0"
description = "Hands-on robotics kinematics, MuJoCo, and ROS 2 learning workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2,<4.0",
    "numpy>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]



[tool.pyrefly]
search-path = [".", ".ros_stubs", "ros2_ws/install/robot_interfaces/lib/python3.12/site-packages"]
